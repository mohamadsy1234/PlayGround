<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Twin Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>⚙️ Settings</h1>

    <div class="section">
      <h2>Working Hours</h2>
      <div class="setting">
        <label for="startHour">Start Hour:</label>
        <input type="number" id="startHour" min="0" max="23" value="8">
      </div>
      <div class="setting">
        <label for="endHour">End Hour:</label>
        <input type="number" id="endHour" min="0" max="23" value="2">
      </div>
    </div>

    <div class="section">
      <h2>Rate Limiting</h2>
      <div class="setting">
        <label for="perHourLimit">Per Hour Limit:</label>
        <input type="number" id="perHourLimit" min="1" value="40">
      </div>
      <div class="setting">
        <label for="per10MinLimit">Per 10-Min Limit:</label>
        <input type="number" id="per10MinLimit" min="1" value="12">
      </div>
    </div>

    <div class="section">
      <h2>Pricing</h2>
      <div id="pricingTable">
        <!-- Populated by JS -->
      </div>
    </div>

    <div class="section">
      <h2>Quick Templates (F-keys)</h2>
      <div class="setting">
        <label for="template1">F1 Template:</label>
        <textarea id="template1" placeholder="Template text for F1"></textarea>
      </div>
      <div class="setting">
        <label for="template2">F2 Template:</label>
        <textarea id="template2" placeholder="Template text for F2"></textarea>
      </div>
    </div>

    <button id="saveBtn" class="btn-save">💾 Save Settings</button>
    <span id="status" class="status-message"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
